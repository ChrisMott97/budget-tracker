[project]
name = "budget-buddy"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Chris Mott", email = "ChrisMott97@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "python-multipart>=0.0.32",
]

[project.scripts]
budget-buddy = "budget_buddy:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.budget_buddy.main:app"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
